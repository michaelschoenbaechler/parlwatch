name: Android Deploy

on:
  # TEMPORARY: builds the bundle on pushes to the PR branch so the workflow can be
  # tested before it reaches main. Remove before merging.
  push:
    branches: [claude/android-support]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - internal
          - production
          - bundle
        default: internal
      version_name:
        description: Optional version name (versionName), e.g. 2026.3.3
        required: false
        type: string

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Zurich
      ANDROID_PACKAGE_NAME: ch.michaelschoenbaechler.parlwatch.app
      ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web assets and sync Android project
        run: npm run android:prepare

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install signing assets from secrets
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"

          KEYSTORE_PATH="$RUNNER_TEMP/parlwatch-release.keystore"
          SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/play-store-service-account.json"

          umask 077
          echo -n "$ANDROID_KEYSTORE_BASE64" | openssl base64 -d -A > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          # The bundle target never talks to Google Play. It exists for the first
          # manual upload, which happens before the service account can be used,
          # so it must not require that secret.
          if [[ "${{ github.event.inputs.target || 'bundle' }}" == "bundle" ]]; then
            exit 0
          fi

          : "${PLAY_STORE_SERVICE_ACCOUNT_JSON:?Missing PLAY_STORE_SERVICE_ACCOUNT_JSON}"
          echo -n "$PLAY_STORE_SERVICE_ACCOUNT_JSON" | openssl base64 -d -A > "$SERVICE_ACCOUNT_PATH"

          if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$SERVICE_ACCOUNT_PATH"; then
            echo "::error::PLAY_STORE_SERVICE_ACCOUNT_JSON does not decode to valid JSON."
            exit 1
          fi

          echo "PLAY_STORE_SERVICE_ACCOUNT_JSON_PATH=$SERVICE_ACCOUNT_PATH" >> "$GITHUB_ENV"

      # TEMPORARY: diagnoses the signing failure without printing any secret. Remove before merging.
      - name: Diagnose signing secrets
        run: |
          echo "keystore password length: ${#ANDROID_KEYSTORE_PASSWORD}"
          echo "key password length: ${#ANDROID_KEY_PASSWORD}"
          echo "key alias length: ${#ANDROID_KEY_ALIAS}"
          if [[ "$ANDROID_KEY_PASSWORD" == "$ANDROID_KEYSTORE_PASSWORD" ]]; then echo "passwords identical: yes"; else echo "passwords identical: no"; fi
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E "Alias name|SHA256:" || true
          for label in key keystore; do
            if [[ $label == key ]]; then pw="$ANDROID_KEY_PASSWORD"; else pw="$ANDROID_KEYSTORE_PASSWORD"; fi
            if keytool -certreq -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 -alias "$ANDROID_KEY_ALIAS" -keypass "$pw" -file /dev/null >/dev/null 2>&1; then
              echo "$label password unlocks the key: yes"
            else
              echo "$label password unlocks the key: no"
            fi
          done

      - name: Install Fastlane dependencies
        run: bundle install
        working-directory: apps/ionic/android

      - name: Deploy to Google Play
        run: |
          case "${{ github.event.inputs.target || 'bundle' }}" in
            internal) bundle exec fastlane deploy_internal ;;
            production) bundle exec fastlane deploy_production ;;
            bundle) bundle exec fastlane build_bundle ;;
          esac
        working-directory: apps/ionic/android

      - name: Attach signed bundle to the run
        if: (github.event.inputs.target || 'bundle') == 'bundle'
        uses: actions/upload-artifact@v7
        with:
          name: parlwatch-android-bundle
          path: apps/ionic/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove decoded signing assets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/parlwatch-release.keystore"
          rm -f "$RUNNER_TEMP/play-store-service-account.json"
          rm -f apps/ionic/android/app/build/signing/release.keystore
