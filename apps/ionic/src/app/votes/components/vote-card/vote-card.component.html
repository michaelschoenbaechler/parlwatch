<ng-container *transloco="let t; prefix: 'votes.voteCard'">
  <app-text-card
    [title]="
      vote().BusinessShortNumber +
      (vote().Subject ? ' - ' + vote().Subject : '')
    "
    [subtitle]="
      t('votedOn', {
        date: vote().VoteEnd | oDataDateTime,
        time: vote().VoteEnd | oDataDateTime: 'time'
      })
    "
    [HtmlText]="vote().BillTitle ? vote().BillTitle : vote().BusinessTitle"
  >
    <app-voting-bar [votings]="vote().Votings" />
    <ng-content />
  </app-text-card>
</ng-container>
