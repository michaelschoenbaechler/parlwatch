<div class="voting-bar">
  @for (segment of segments(); track segment.decision) {
    <div
      class="fill"
      [class]="segment.decision"
      [style.width.%]="segment.percentage"
      [style.left.%]="segment.left"
    ></div>
  }
</div>

@if (showCounts()) {
  <ul class="voting-counts" *transloco="let t; prefix: 'votes.decision'">
    @for (segment of segments(); track segment.decision) {
      <li>
        <span class="dot" [class]="segment.decision"></span>
        <strong>{{ segment.count }}</strong> {{ t(segment.decision) }}
      </li>
    }
  </ul>
}
