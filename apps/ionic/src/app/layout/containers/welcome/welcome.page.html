<ng-container *transloco="let t;">
  <ion-content>
    <img
      class="logo"
      width="100"
      src="assets/logo-caption.png"
      alt="ParlWatch Logo"
    />
    @if (!showCantonStep()) {
    <div class="ion-padding">
      <p class="welcome-text">{{ t('welcome.text') }}</p>
      <ion-button expand="block" color="primary" (click)="onDiscover()"
        >{{ t('welcome.discover') }}
      </ion-button>
    </div>
    } @else {
    <div class="ion-padding canton-step">
      <h2 class="canton-step-title">{{ t('welcome.cantons.title') }}</h2>
      <p class="welcome-text canton-step-text">
        {{ t('welcome.cantons.text') }}
      </p>
      <app-canton-picker />
      <div class="canton-step-actions">
        <ion-button expand="block" color="primary" (click)="onStart()">
          @if (parliamentStore.isCantonalEnabled()) { {{
          t('welcome.cantons.continue') }} } @else { {{
          t('welcome.cantons.skip') }} }
        </ion-button>
      </div>
    </div>
    }
  </ion-content>
</ng-container>
