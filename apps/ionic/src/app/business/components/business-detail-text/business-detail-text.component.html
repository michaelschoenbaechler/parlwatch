<ng-container *transloco="let t; prefix: 'business.detailText'">
  @for (section of sections(); track section.key) {
    <app-text-card
      [title]="t(section.key)"
      [HtmlText]="section.isTruncated ? section.preview : section.html"
    >
      @if (section.isTruncated) {
        <ion-button
          class="read-more"
          fill="clear"
          size="small"
          (click)="readSection(section)"
        >
          {{ t('readMore') }}
          <ion-icon slot="end" name="chevron-forward-outline" />
        </ion-button>
      }
    </app-text-card>
  }

  <ion-modal [isOpen]="!!openSection()" (didDismiss)="closeSection()">
    <ng-template>
      @if (openSection(); as section) {
        <ion-header>
          <ion-toolbar>
            <ion-title>{{ t(section.key) }}</ion-title>
            <ion-buttons slot="end">
              <ion-button (click)="closeSection()">{{ t('close') }}</ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
        <ion-content class="ion-padding">
          <div class="section-text" [innerHTML]="section.html | safeHtml"></div>
        </ion-content>
      }
    </ng-template>
  </ion-modal>
</ng-container>
