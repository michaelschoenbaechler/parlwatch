<ng-container *transloco="let t; prefix: 'parliament.hint'">
  @if (parliamentStore.showHint()) {
    <div class="hint-card">
      <div class="hint-header">
        <ion-icon name="map-outline" aria-hidden="true" />
        <div class="hint-title">{{ t('title') }}</div>
        <ion-button
          fill="clear"
          size="small"
          class="hint-close"
          [attr.aria-label]="t('dismiss')"
          (click)="dismiss()"
        >
          <ion-icon slot="icon-only" name="close-outline" />
        </ion-button>
      </div>
      <p class="hint-text">{{ t('text') }}</p>
      <ion-button size="small" fill="outline" (click)="openSettings()">
        {{ t('action') }}
        <ion-icon slot="end" name="arrow-forward-outline" />
      </ion-button>
    </div>
  }
</ng-container>
